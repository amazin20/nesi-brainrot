name: Exact V10 regression workspace
on:
  push:
    branches: ['fix/level-five-advanced-v10']
    paths: ['.github/workflows/v10-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Package source and dependencies without credentials
        run: |
          git rev-parse HEAD > SOURCE_REVISION
          tar -czf /tmp/v10-workspace.tgz src scripts tests docs public/models public/draco node_modules index.html package.json package-lock.json vite.config.js PROJECT_STATUS.md README.md SOURCE_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: v10-workspace
          path: /tmp/v10-workspace.tgz
          retention-days: 1
