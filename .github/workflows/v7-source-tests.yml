name: V7 original mesh fixtures
on:
  push:
    branches: ['fix/portal-life-levels-v7']
    paths: ['.github/workflows/v7-source-tests.yml']
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package only repository model fixtures
        run: tar -czf /tmp/nesi-original-models.tgz public/models
      - uses: actions/upload-artifact@v4
        with:
          name: original-model-fixtures
          path: /tmp/nesi-original-models.tgz
          retention-days: 1
