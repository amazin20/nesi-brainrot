name: Apply and verify V7 revision
on:
  push:
    branches: ['fix/portal-life-levels-v7']
    paths: ['.github/workflows/v7-apply-verified.yml']
permissions:
  contents: write
concurrency:
  group: v7-apply
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact patch and apply only to review branch
        run: |
          test "$GITHUB_REF_NAME" = 'fix/portal-life-levels-v7'
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib
          encoded=''.join(p.read_text().strip() for p in sorted(pathlib.Path('maintenance').glob('v7-patch-*.b64')))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='3f1f1dae0cf0803dbeac68976914d9ba42bb6c26ce54dc0b721ddf85b55cb589'
          pathlib.Path('/tmp/v7.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/v7.patch
          git apply --unidiff-zero /tmp/v7.patch
          git apply --check maintenance/v7-polish.patch
          git apply maintenance/v7-polish.patch
          rm maintenance/v7-patch-*.b64 maintenance/v7-polish.patch
      - name: Dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Unit tests, build and continuous routes on original meshes
        run: |
          npm run check
          node scripts/lab-journey.mjs
          node scripts/v7-journey.mjs
      - name: Production WebGL and visible menu checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/nesi-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node scripts/v7-browser.mjs
      - name: Commit verified source without changing main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Actions content tokens intentionally do not modify workflow files.
          # Their reviewed changes and cleanup are committed separately via the GitHub connector.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -u
          git add src/game/LabArchitecturalGate.js src/game/LabCampaignLevels.js src/game/LabLevelLifecycle.js src/game/LabPerformance.js src/game/LabTutorial.js scripts/v7-browser.mjs scripts/v7-journey.mjs tests/lab-v7.test.js docs/RELEASE_V7.md qa/v7-campaign.json
          git commit -m 'V7: repair portal reversals, add two complete courses, living motion and clean UI'
          git push origin HEAD:refs/heads/fix/portal-life-levels-v7
          REVISION="$(git rev-parse HEAD)" node --input-type=module -e "import fs from 'node:fs';fs.writeFileSync('dist/build-info.json',JSON.stringify({commit:process.env.REVISION,version:'v7',verified:true}));"
      - name: Preserve verification and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-verification
          path: |
            smoke-artifacts/*.png
            smoke-artifacts/report.json
            qa/continuous-journey.json
            qa/v7-campaign.json
          retention-days: 7
      - name: Preserve tested build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v7-tested-build
          path: dist/
          retention-days: 7
