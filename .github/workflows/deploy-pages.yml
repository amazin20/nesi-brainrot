name: Deploy verified portal game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Verify source, complete routes and jump shortcuts
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Check actual production browser and advertising contract
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex > /tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Record exact deployed revision
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {CAMPAIGN} from './src/game/LabCampaignLevels.js';
          fs.writeFileSync('dist/build-info.json',JSON.stringify({commit:process.env.GITHUB_SHA,version:'v10-repair',levels:CAMPAIGN.length,repository:process.env.GITHUB_REPOSITORY,run:process.env.GITHUB_RUN_ID},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-evidence
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public page matches this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          expected=os.environ['GITHUB_SHA']
          for attempt in range(30):
              try:
                  req=urllib.request.Request(base+'build-info.json?revision='+expected+'&attempt='+str(attempt),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response: info=json.load(response)
                  if info.get('commit')==expected and info.get('levels')==5 and info.get('version')=='v10-repair':
                      with urllib.request.urlopen(base+'?verify='+expected,timeout=20) as response: html=response.read().decode()
                      assert 'settings-level-select' in html and 'id="level-number"' in html
                      assert 'id="quick-hint"' not in html
                      print('LIVE V10 REPAIR VERIFIED:',expected,base)
                      break
              except Exception as error: print(type(error).__name__,str(error))
              time.sleep(5)
          else: raise SystemExit('Public build did not match verified revision')
          PY
