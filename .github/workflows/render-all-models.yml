name: Render all repository models

on:
  push:
    branches: [level-from-scratch-v1]
    paths:
      - '.github/workflows/render-all-models.yml'
      - 'model-gallery.html'
      - 'src/modelGallery.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Vite gallery
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/model-gallery.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/nesi-brainrot/model-gallery.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/model-gallery.log
          exit 1

      - name: Capture gallery in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p model-renders
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=90000 \
            --window-size=1700,3900 \
            --hide-scrollbars \
            --screenshot=model-renders/all-models.png \
            http://127.0.0.1:5173/nesi-brainrot/model-gallery.html
          test -s model-renders/all-models.png

      - name: Upload model renders
        uses: actions/upload-artifact@v4
        with:
          name: all-glb-model-renders
          path: model-renders/
          if-no-files-found: error
