name: Playable demo smoke

on:
  push:
    branches: [main, playable-demo-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Unit tests and production build
        run: npm run check

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nesi-preview.log 2>&1 &
          echo $! > /tmp/nesi-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/nesi-brainrot/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nesi-preview.log
          exit 1

      - name: Verify all GLB assets are served
        run: |
          for model in \
            model-01-player.glb \
            model-02-cargo.glb \
            model-03-swing-hammer.glb \
            model-04-bounce-block.glb \
            model-05-checkpoint.glb \
            model-06-finish-flag.glb \
            model-07-spin-hammer.glb \
            model-08-roller.glb \
            model-09-hurdles.glb \
            model-10-platform.glb; do
            curl -fsSI "http://127.0.0.1:4173/nesi-brainrot/models/$model" >/dev/null
          done

      - name: Run WebGL gameplay smoke in Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export CHROME_PATH="$CHROME"
          mkdir -p smoke-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            protocolTimeout: 30000,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
            ],
          });

          const browserMessages = [];
          const report = { browserMessages };
          let page;
          const capture = async () => page.evaluate(() => ({
            dataset: { ...document.documentElement.dataset },
            diagnostics: window.__NESI_DEMO_DIAGNOSTICS__ ?? null,
            error: window.__NESI_DEMO_ERROR__ ?? null,
            winScreenActive: document.querySelector('#win-screen')?.classList.contains('screen--active') ?? false,
          }));

          try {
            page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900, deviceScaleFactor: 1 });
            page.on('console', (message) => {
              const text = `[console:${message.type()}] ${message.text()}`;
              browserMessages.push(text);
              console.log(text);
            });
            page.on('pageerror', (error) => {
              const text = `[pageerror] ${error.stack || error}`;
              browserMessages.push(text);
              console.error(text);
            });
            page.on('requestfailed', (request) => {
              const text = `[requestfailed] ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`;
              browserMessages.push(text);
              console.error(text);
            });

            await page.goto('http://127.0.0.1:4173/nesi-brainrot/?smoke=1', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForFunction(() => {
              const state = document.documentElement.dataset.runtimeState;
              return state === 'playing' || state === 'error';
            }, { timeout: 90000, polling: 250 });

            report.startup = await capture();
            const data = report.startup.dataset;
            if (data.gameReady !== 'true') throw new Error(`gameReady=${data.gameReady}`);
            if (data.levelSmoke !== 'pass') throw new Error(`levelSmoke=${data.levelSmoke}`);
            if (data.modelsLoaded !== '10') throw new Error(`modelsLoaded=${data.modelsLoaded}`);
            if (data.modelFallbacks !== '0') throw new Error(`modelFallbacks=${data.modelFallbacks}`);
            if (data.runtimeState !== 'playing') throw new Error(`runtimeState=${data.runtimeState}; ${report.startup.error || ''}`);

            const startZ = report.startup.diagnostics?.playerPosition?.z;
            await page.keyboard.down('w');
            await page.waitForFunction(
              () => window.__NESI_DEMO_DIAGNOSTICS__?.isCarrying === true,
              { timeout: 8000, polling: 100 },
            );
            await page.keyboard.up('w');
            report.pickup = await capture();
            const pickupZ = report.pickup.diagnostics?.playerPosition?.z;
            if (!Number.isFinite(startZ) || !Number.isFinite(pickupZ) || pickupZ >= startZ - 1.5) {
              throw new Error(`keyboard movement did not advance enough: ${startZ} -> ${pickupZ}`);
            }
            if (!report.pickup.diagnostics?.isCarrying) throw new Error('cargo pickup did not trigger');

            const baselineY = report.pickup.diagnostics?.playerPosition?.y ?? 0;
            await page.keyboard.press('Space');
            await page.waitForFunction(
              (y) => (window.__NESI_DEMO_DIAGNOSTICS__?.playerPosition?.y ?? y) > y + 0.2,
              { timeout: 3000, polling: 100 },
              baselineY,
            );
            report.jump = await capture();

            await page.evaluate(() => {
              const game = window.__NESI_DEMO_GAME__;
              game.player.position.copy(game.checkpoints[1]);
              game.player.velocity.set(0, 0, 0);
            });
            await page.waitForFunction(
              () => window.__NESI_DEMO_DIAGNOSTICS__?.checkpointIndex >= 1,
              { timeout: 3000, polling: 100 },
            );
            report.checkpoint1 = await capture();

            await page.evaluate(() => {
              const game = window.__NESI_DEMO_GAME__;
              game.player.position.copy(game.checkpoints[2]);
              game.player.velocity.set(0, 0, 0);
            });
            await page.waitForFunction(
              () => window.__NESI_DEMO_DIAGNOSTICS__?.checkpointIndex >= 2,
              { timeout: 3000, polling: 100 },
            );
            report.checkpoint2 = await capture();

            await page.evaluate(() => {
              const game = window.__NESI_DEMO_GAME__;
              game.player.position.set(0, game.checkpoints[2].y, -175.2);
              game.player.velocity.set(0, 0, 0);
            });
            await page.waitForFunction(
              () => window.__NESI_DEMO_DIAGNOSTICS__?.state === 'won'
                && document.querySelector('#win-screen')?.classList.contains('screen--active'),
              { timeout: 5000, polling: 100 },
            );
            report.finish = await capture();
            if (!report.finish.winScreenActive) throw new Error('win screen did not open');
            if (report.finish.diagnostics?.state !== 'won') throw new Error('game did not enter won state');

            console.log(JSON.stringify(report, null, 2));
          } catch (error) {
            report.failure = String(error?.stack || error);
            if (page) {
              try { report.failureState = await capture(); } catch {}
            }
            throw error;
          } finally {
            fs.writeFileSync('smoke-artifacts/report.json', JSON.stringify(report, null, 2));
            if (page) {
              try { fs.writeFileSync('smoke-artifacts/demo-dom.html', await page.content()); } catch {}
            }
            await browser.close();
          }
          NODE

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-demo-smoke
          path: smoke-artifacts/
          if-no-files-found: warn
