name: Playable demo smoke

on:
  push:
    branches: [main, playable-demo-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser driver
        run: npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Unit tests and production build
        run: npm run check

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nesi-preview.log 2>&1 &
          echo $! > /tmp/nesi-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/nesi-brainrot/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nesi-preview.log
          exit 1

      - name: Verify all GLB assets are served
        run: |
          for model in \
            model-01-player.glb \
            model-02-cargo.glb \
            model-03-swing-hammer.glb \
            model-04-bounce-block.glb \
            model-05-checkpoint.glb \
            model-06-finish-flag.glb \
            model-07-spin-hammer.glb \
            model-08-roller.glb \
            model-09-hurdles.glb \
            model-10-platform.glb; do
            curl -fsSI "http://127.0.0.1:4173/nesi-brainrot/models/$model" >/dev/null
          done

      - name: Run deterministic WebGL gameplay smoke in Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export CHROME_PATH="$CHROME"
          mkdir -p smoke-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            protocolTimeout: 30000,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--disable-background-timer-throttling',
              '--disable-renderer-backgrounding',
            ],
          });

          const browserMessages = [];
          const report = { browserMessages };
          let page;
          const capture = async () => page.evaluate(() => ({
            dataset: { ...document.documentElement.dataset },
            diagnostics: window.__NESI_DEMO_DIAGNOSTICS__ ?? null,
            error: window.__NESI_DEMO_ERROR__ ?? null,
            winScreenActive: document.querySelector('#win-screen')?.classList.contains('screen--active') ?? false,
          }));

          try {
            page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 900, deviceScaleFactor: 1 });
            page.on('console', (message) => {
              const text = `[console:${message.type()}] ${message.text()}`;
              browserMessages.push(text);
              console.log(text);
            });
            page.on('pageerror', (error) => {
              const text = `[pageerror] ${error.stack || error}`;
              browserMessages.push(text);
              console.error(text);
            });
            page.on('requestfailed', (request) => {
              const text = `[requestfailed] ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`;
              browserMessages.push(text);
              console.error(text);
            });

            await page.goto('http://127.0.0.1:4173/nesi-brainrot/?smoke=1', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });
            await page.waitForFunction(() => {
              const state = document.documentElement.dataset.runtimeState;
              return state === 'playing' || state === 'error';
            }, { timeout: 90000, polling: 250 });

            report.startup = await capture();
            const data = report.startup.dataset;
            if (data.gameReady !== 'true') throw new Error(`gameReady=${data.gameReady}`);
            if (data.levelSmoke !== 'pass') throw new Error(`levelSmoke=${data.levelSmoke}`);
            if (data.modelsLoaded !== '10') throw new Error(`modelsLoaded=${data.modelsLoaded}`);
            if (data.modelFallbacks !== '0') throw new Error(`modelFallbacks=${data.modelFallbacks}`);
            if (data.runtimeState !== 'playing') throw new Error(`runtimeState=${data.runtimeState}; ${report.startup.error || ''}`);

            report.gameplay = await page.evaluate(() => {
              const game = window.__NESI_DEMO_GAME__;
              if (!game) throw new Error('smoke game handle is missing');
              const step = (count, startTime = performance.now() / 1000) => {
                for (let i = 0; i < count; i += 1) game.updatePlayer(1 / 60, startTime + i / 60);
              };
              const point = () => ({ x: game.player.position.x, y: game.player.position.y, z: game.player.position.z });

              const start = point();
              window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyW', key: 'w', bubbles: true }));
              const keyboardRegistered = game.input.keys.has('KeyW');
              step(90);
              window.dispatchEvent(new KeyboardEvent('keyup', { code: 'KeyW', key: 'w', bubbles: true }));
              const afterMove = point();
              const pickedUp = game.player.hasCargo;

              const baselineY = game.player.position.y;
              window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Space', key: ' ', bubbles: true }));
              const jumpQueued = game.input.jumpQueued;
              step(2);
              window.dispatchEvent(new KeyboardEvent('keyup', { code: 'Space', key: ' ', bubbles: true }));
              const afterJump = point();

              game.player.position.copy(game.checkpoints[1]);
              game.player.velocity.set(0, 0, 0);
              game.updateCheckpoints();
              const checkpoint1 = game.checkpointIndex;

              game.player.position.copy(game.checkpoints[2]);
              game.player.velocity.set(0, 0, 0);
              game.updateCheckpoints();
              const checkpoint2 = game.checkpointIndex;

              game.player.position.set(0, game.checkpoints[2].y, -175.2);
              game.player.velocity.set(0, 0, 0);
              game.updatePlayer(1 / 60, performance.now() / 1000);
              const finishState = game.state;
              const winScreenActive = document.querySelector('#win-screen')?.classList.contains('screen--active') ?? false;

              return {
                start,
                keyboardRegistered,
                afterMove,
                movedDistanceZ: start.z - afterMove.z,
                pickedUp,
                jumpQueued,
                baselineY,
                afterJump,
                checkpoint1,
                checkpoint2,
                finishState,
                winScreenActive,
              };
            });

            const game = report.gameplay;
            if (!game.keyboardRegistered) throw new Error('KeyW did not reach InputController');
            if (game.movedDistanceZ < 1.5) throw new Error(`movement too small: ${game.movedDistanceZ}`);
            if (!game.pickedUp) throw new Error('cargo pickup did not trigger');
            if (!game.jumpQueued || game.afterJump.y <= game.baselineY + 0.1) throw new Error('jump did not trigger');
            if (game.checkpoint1 < 1 || game.checkpoint2 < 2) throw new Error(`checkpoints failed: ${game.checkpoint1}/${game.checkpoint2}`);
            if (game.finishState !== 'won' || !game.winScreenActive) throw new Error(`finish failed: ${game.finishState}/${game.winScreenActive}`);

            report.finish = await capture();
            console.log(JSON.stringify(report, null, 2));
          } catch (error) {
            report.failure = String(error?.stack || error);
            if (page) {
              try { report.failureState = await capture(); } catch {}
            }
            throw error;
          } finally {
            fs.writeFileSync('smoke-artifacts/report.json', JSON.stringify(report, null, 2));
            if (page) {
              try { fs.writeFileSync('smoke-artifacts/demo-dom.html', await page.content()); } catch {}
            }
            await browser.close();
          }
          NODE

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-demo-smoke
          path: smoke-artifacts/
          if-no-files-found: warn
