name: Playable demo smoke
on:
  push:
    branches: [main, playable-demo-v1, animation-v4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and browser driver
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Unit tests and production build
        run: npm run check
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/nesi-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/nesi-brainrot/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nesi-preview.log
          exit 1
      - name: Verify replacement asset inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { ALL_LAB_ASSETS } from './src/game/labAssets.js';
          if (ALL_LAB_ASSETS.length !== 19) throw new Error('Expected 19 active models');
          for (const asset of ALL_LAB_ASSETS) {
            if (!fs.existsSync('dist/models/' + asset.file)) throw new Error('Missing ' + asset.file);
          }
          for (const file of fs.readdirSync('dist/models')) {
            if (/model-(03|04|05|06|07|08|09|10)-/.test(file)) throw new Error('Removed asset still shipped: ' + file);
          }
          NODE
      - name: Run WebGL gameplay and record character
        env:
          RECORD_VIDEO: '1'
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          export CHROME_PATH
          node scripts/lab-smoke.mjs
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-demo-smoke
          path: |
            smoke-artifacts/report.json
            smoke-artifacts/*.png
            smoke-artifacts/player-animation.mp4
            smoke-artifacts/recording-fallback/
          if-no-files-found: warn
