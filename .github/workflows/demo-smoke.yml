name: Playable campaign verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Tests and browser build
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Production browser tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex > /tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-verification
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
          retention-days: 7
      - name: Keep verified browser package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser
          path: dist/
          retention-days: 7
      - name: Keep Yandex draft package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-yandex-draft
          path: dist-yandex/
          retention-days: 7
