name: V10 level-five repair verification
on:
  push:
    branches: ['fix/level-five-advanced-v10']
    paths: ['.github/workflows/v10-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply readable patch only to the review branch
        run: |
          test "$GITHUB_REF_NAME" = 'fix/level-five-advanced-v10'
          git apply --unidiff-zero --check maintenance/v10-fixes.patch
          git apply --unidiff-zero maintenance/v10-fixes.patch
          rm maintenance/v10-fixes.patch
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false puppeteer-core@24.16.0
      - name: Unit tests, normal solutions and adversarial jumps
        run: |
          npm run check
          node scripts/v8-package-check.mjs
          node scripts/v8-journey.mjs
          node scripts/v10-shortcuts.mjs
          cp src/game/LabCampaignLevels.js /tmp/v10-current-layout.js
          git show 81697d727f827308892a67bb5ac464d7d8bca4ec:src/game/LabCampaignLevels.js > src/game/LabCampaignLevels.js
          node scripts/v10-shortcuts.mjs --baseline
          cp /tmp/v10-current-layout.js src/game/LabCampaignLevels.js
          npm run build -- --mode yandex --outDir dist-yandex
      - name: Production browser and SDK contract checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-yandex > /tmp/yandex-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          node scripts/v8-browser.mjs
          node scripts/v8-yandex-browser.mjs
      - name: Commit the verified repair without changing main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add qa/v8-journeys.json qa/v10-shortcut-audit.json qa/v10-baseline-bypass.json
          git commit -m 'V10: repair tilted portal placement and jump bypasses; level HUD and flight motion'
          git push origin HEAD:refs/heads/fix/level-five-advanced-v10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-repair-evidence
          path: |
            smoke-artifacts/
            qa/v8-journeys.json
            qa/v10-shortcut-audit.json
            qa/v10-baseline-bypass.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v10-repair-browser
          path: dist/
          retention-days: 7
