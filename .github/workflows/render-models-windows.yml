name: Render all models on Windows

on:
  push:
    branches: [level-from-scratch-v1]
    paths:
      - '.github/workflows/render-models-windows.yml'
      - 'model-gallery.html'
      - 'src/modelGallery.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-models-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit
          npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Start Vite gallery
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm run dev -- --host 127.0.0.1 --port 5173 > vite-gallery.log 2>&1" -PassThru
          $process.Id | Out-File vite-gallery.pid
          for ($i = 0; $i -lt 40; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:5173/nesi-brainrot/model-gallery.html" | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          Get-Content vite-gallery.log
          exit 1

      - name: Capture real GLB gallery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path model-renders | Out-Null
          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Chrome executable not found" }
          $env:CHROME_PATH = $chrome
          @'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            timeout: 60000,
            protocolTimeout: 60000,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--disable-background-timer-throttling',
              '--disable-renderer-backgrounding',
              '--user-data-dir=' + process.cwd() + '/chrome-profile',
            ],
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1700, height: 3900, deviceScaleFactor: 1 });
          page.on('console', (message) => console.log(`[browser:${message.type()}] ${message.text()}`));
          page.on('pageerror', (error) => console.error(`[pageerror] ${error.stack || error}`));
          await page.goto('http://127.0.0.1:5173/nesi-brainrot/model-gallery.html', {
            waitUntil: 'domcontentloaded',
            timeout: 30000,
          });
          await page.waitForFunction(
            () => document.documentElement.dataset.galleryReady === 'true' || document.documentElement.dataset.galleryReady === 'error',
            { timeout: 90000, polling: 250 },
          );
          const state = await page.evaluate(() => ({
            galleryReady: document.documentElement.dataset.galleryReady,
            status: document.querySelector('#status')?.textContent,
            readyCards: document.querySelectorAll('.card[data-ready="true"]').length,
          }));
          console.log(JSON.stringify(state));
          if (state.galleryReady !== 'true' || state.readyCards !== 10) throw new Error(`Gallery failed: ${JSON.stringify(state)}`);
          await page.screenshot({ path: 'model-renders/all-models.png', fullPage: true });
          fs.writeFileSync('model-renders/gallery-state.json', JSON.stringify(state, null, 2));
          await browser.close();
          '@ | node --input-type=module
          if (-not (Test-Path model-renders/all-models.png)) { throw "Screenshot was not created" }

      - name: Upload model renders
        uses: actions/upload-artifact@v4
        with:
          name: all-glb-model-renders-windows
          path: model-renders/
          if-no-files-found: error
