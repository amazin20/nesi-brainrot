name: V11 exact development workspace
on:
  push:
    branches: [feature/ten-chambers-v11]
    paths: [.github/workflows/v11-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tar -czf /tmp/v11-workspace.tgz src scripts tests docs public/models node_modules index.html package.json package-lock.json vite.config.js PROJECT_STATUS.md README.md .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: v11-workspace
          path: /tmp/v11-workspace.tgz
          retention-days: 1
